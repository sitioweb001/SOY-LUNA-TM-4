<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soy Luna · Volver a Rodar (T4)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at 10% 20%, #2d1b3d 0%, #0f0718 100%);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #f0e6f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(180,70,255,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255,100,200,0.10) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .app {
            max-width: 1200px;
            width: 100%;
            background: rgba(30, 15, 45, 0.82);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 30px;
            box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(180, 70, 255, 0.2);
            border: 1px solid rgba(200, 130, 255, 0.15);
            position: relative;
            z-index: 1;
            transition: box-shadow 0.3s;
        }
        .app:hover {
            box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(180, 70, 255, 0.3), 0 0 40px rgba(180, 70, 255, 0.1);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(200, 130, 255, 0.15);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #b47ae0, #d47bff, #b47ae0, transparent);
            filter: blur(2px);
            opacity: 0.6;
        }
        .header h1 {
            font-weight: 700;
            font-size: 2.1rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f9b5d0, #d47bff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(180, 70, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1::before {
            content: '✨';
            font-size: 1.8rem;
            -webkit-text-fill-color: initial;
            filter: drop-shadow(0 0 10px rgba(180, 70, 255, 0.5));
        }
        .header .badge {
            background: linear-gradient(135deg, rgba(180, 70, 255, 0.25), rgba(130, 50, 200, 0.15));
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            border: 1px solid rgba(180, 70, 255, 0.3);
            backdrop-filter: blur(4px);
            color: #d4b0ff;
            box-shadow: 0 0 20px rgba(180, 70, 255, 0.1);
            letter-spacing: 0.5px;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 28px;
        }
        @media (max-width: 820px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .app {
                padding: 20px;
            }
        }
        .player-wrapper {
            background: #0d0814;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(180, 70, 255, 0.15);
            position: relative;
        }
        .player-wrapper video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #09050e;
            cursor: pointer;
        }
        .video-error,
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(8px);
            border-radius: 32px 32px 0 0;
        }
        .video-error {
            background: rgba(20, 5, 30, 0.92);
            color: #ff6b6b;
            padding: 30px;
            text-align: center;
            font-size: 1.1rem;
            border: 1px solid rgba(255, 107, 107, 0.2);
            flex-direction: column;
            gap: 10px;
        }
        .video-error.visible {
            display: flex;
        }
        .video-error span {
            color: #b8a5cf;
            font-size: 0.9rem;
        }
        .loading-overlay {
            background: rgba(0, 0, 0, 0.6);
        }
        .loading-overlay.visible {
            display: flex;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(180, 70, 255, 0.15);
            border-top: 4px solid #d47bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 30px rgba(180, 70, 255, 0.2);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .controls {
            padding: 14px 20px 20px;
            background: rgba(18, 8, 28, 0.95);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(180, 70, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .controls-top {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .controls-top .time {
            font-size: 0.9rem;
            font-variant-numeric: tabular-nums;
            color: #c4b0db;
            min-width: 110px;
            font-weight: 500;
        }
        .controls-top .time span {
            color: #f0e6f6;
        }
        .controls-top .volume-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
            opacity: 0.7;
            cursor: not-allowed;
        }
        .controls-top .volume-wrap .icon-emoji {
            font-size: 1.3rem;
            color: #d4b0ff;
            width: 28px;
            text-align: center;
        }
        .btn-icon {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f0e6f6;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.25s;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(180, 70, 255, 0.15);
        }
        .btn-icon:hover {
            background: rgba(180, 70, 255, 0.25);
            transform: scale(1.08);
            border-color: rgba(180, 70, 255, 0.4);
            box-shadow: 0 0 25px rgba(180, 70, 255, 0.15);
        }
        .btn-icon:active {
            transform: scale(0.95);
        }
        .btn-icon.play-btn {
            width: 52px;
            height: 52px;
            font-size: 1.8rem;
            background: rgba(180, 70, 255, 0.2);
            border-color: rgba(180, 70, 255, 0.3);
        }
        .btn-icon.play-btn:hover {
            background: rgba(180, 70, 255, 0.35);
            box-shadow: 0 0 30px rgba(180, 70, 255, 0.2);
        }
        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }
        .progress-wrap input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 10px;
            background: linear-gradient(to right, #b47ae0 0%, #b47ae0 0%, #2d1b3d 0%);
            outline: none;
            transition: background 0.1s;
            cursor: pointer;
        }
        .progress-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle, #d47bff, #a855f7);
            box-shadow: 0 0 20px rgba(180, 70, 255, 0.5);
            border: 2px solid #1c0f2b;
            transition: 0.15s;
            cursor: pointer;
        }
        .progress-wrap input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 0 30px rgba(180, 70, 255, 0.7);
        }
        .progress-wrap input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle, #d47bff, #a855f7);
            border: 2px solid #1c0f2b;
            cursor: pointer;
        }
        .progress-wrap .time-label {
            font-size: 0.85rem;
            color: #c4b0db;
            min-width: 55px;
            text-align: right;
            font-weight: 500;
        }
        .controls-top .volume-wrap input[type="range"] {
            width: 80px;
            height: 4px;
            opacity: 0.5;
            cursor: not-allowed;
        }
        .chapter-list {
            background: rgba(18, 8, 28, 0.6);
            border-radius: 32px;
            padding: 18px 14px 14px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(180, 70, 255, 0.1);
            max-height: 540px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #8b5cf6 transparent;
            box-shadow: inset 0 0 30px rgba(180, 70, 255, 0.03);
        }
        .chapter-list::-webkit-scrollbar {
            width: 5px;
        }
        .chapter-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .chapter-list::-webkit-scrollbar-thumb {
            background: #8b5cf6;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(180, 70, 255, 0.2);
        }
        .chapter-list h2 {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #b8a5cf;
            margin-bottom: 14px;
            padding-left: 8px;
            text-transform: uppercase;
            opacity: 0.7;
        }
        .chapter-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            margin-bottom: 4px;
            position: relative;
        }
        .chapter-item:hover {
            background: rgba(180, 70, 255, 0.10);
            border-color: rgba(180, 70, 255, 0.15);
            transform: translateX(4px);
        }
        .chapter-item.active {
            background: rgba(180, 70, 255, 0.18);
            border-color: rgba(180, 70, 255, 0.3);
            box-shadow: 0 0 25px rgba(180, 70, 255, 0.08);
        }
        .chapter-item .num {
            font-weight: 700;
            font-size: 0.9rem;
            color: #d4b0ff;
            min-width: 30px;
            text-align: center;
        }
        .chapter-item .title {
            flex: 1;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: -0.2px;
            color: #e8daf5;
        }
        .chapter-item .status-icon {
            font-size: 1.2rem;
            width: 28px;
            text-align: center;
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .chapter-item .status-icon.checked {
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
        }
        .chapter-item .status-icon.pending {
            color: #8b7aa3;
            font-size: 0.9rem;
        }
        .folder-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid rgba(180, 70, 255, 0.1);
        }
        .folder-selector button {
            background: rgba(180, 70, 255, 0.2);
            border: 1px solid rgba(180, 70, 255, 0.3);
            color: #d4b0ff;
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .folder-selector button:hover {
            background: rgba(180, 70, 255, 0.35);
            box-shadow: 0 0 20px rgba(180, 70, 255, 0.15);
        }
        .folder-selector .folder-path {
            font-size: 0.8rem;
            color: #b8a5cf;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .release-notice {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.2);
            color: #4ade80;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            margin-left: 10px;
        }
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5rem;
            }
            .header h1::before {
                font-size: 1.2rem;
            }
            .controls-top .time {
                font-size: 0.75rem;
                min-width: 80px;
            }
            .btn-icon {
                width: 38px;
                height: 38px;
                font-size: 1.1rem;
            }
            .btn-icon.play-btn {
                width: 46px;
                height: 46px;
                font-size: 1.4rem;
            }
            .chapter-item .title {
                font-size: 0.85rem;
            }
            .chapter-item .status-icon {
                font-size: 1rem;
                width: 24px;
            }
            .controls-top .volume-wrap input[type="range"] {
                width: 50px;
            }
            .folder-selector {
                flex-direction: column;
                align-items: stretch;
            }
            .folder-selector .folder-path {
                white-space: normal;
            }
        }
        .icon-emoji {
            font-size: 1.2rem;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div class="app" role="main">
        <header class="header">
            <h1>Soy Luna · Volver a Rodar</h1>
            <span class="badge">✦ Temporada 4 · 12 capítulos</span>
        </header>

        <div class="folder-selector">
            <button id="selectFolderBtn">📁 Seleccionar carpeta de videos</button>
            <span class="folder-path" id="folderPath">Usando GitHub Releases (CP1.mp4 - CP12.mp4)</span>
            <span class="release-notice">☁️ v1.0.0 POWERBY : EMERSON CASTRO </span>
        </div>

        <div class="main-grid">
            <section class="player-wrapper">
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="spinner"></div>
                </div>
                <video id="videoPlayer" preload="metadata" playsinline></video>
                <div class="video-error" id="videoError">
                    ⚠️ No se pudo cargar el video
                    <span>Verifica el enlace de GitHub Releases o selecciona una carpeta local.</span>
                </div>

                <div class="controls">
                    <div class="progress-wrap">
                        <input type="range" id="progressBar" value="0" step="0.001" aria-label="Barra de progreso">
                        <span class="time-label" id="currentTimeDisplay">0:00</span>
                    </div>
                    <div class="controls-top">
                        <button class="btn-icon play-btn" id="playPauseBtn" aria-label="Reproducir / Pausar">
                            <span id="playIcon">▶</span>
                        </button>
                        <span class="time" id="timeDisplay">
                            <span id="currentTimeText">0:00</span> / <span id="durationText">0:00</span>
                        </span>

                        <div class="volume-wrap" title="Volumen fijado al 100%">
                            <span class="icon-emoji" id="volumeIcon">🔊</span>
                            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" disabled>
                        </div>

                        <button class="btn-icon" id="fullscreenBtn" aria-label="Pantalla completa">
                            <span class="icon-emoji">⛶</span>
                        </button>
                    </div>
                </div>
            </section>

            <aside class="chapter-list" id="chapterList">
                <h2>📖 Capítulos</h2>
                <div id="chapterContainer"></div>
            </aside>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const TOTAL_CHAPTERS = 12;

            // ============================================================
            //  CONFIGURACIÓN: URLs de GitHub Releases
            //  Reemplaza "sitioweb001" y "SOY-LUNA-TM-4" si tu repositorio es diferente.
            //  Asegúrate de que el tag (v1.0.0) coincida con tu Release.
            // ============================================================
            const RELEASE_BASE_URL =
                'https://github.com/sitioweb001/SOY-LUNA-TM-4/releases/download/v1.0.0/';

            // Genera la URL para el capítulo num
            const getReleaseUrl = (num) => `${RELEASE_BASE_URL}CP${num}.mp4`;

            // ============================================================
            //  DOM
            // ============================================================
            const video = document.getElementById('videoPlayer');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const playIcon = document.getElementById('playIcon');
            const progressBar = document.getElementById('progressBar');
            const currentTimeDisplay = document.getElementById('currentTimeDisplay');
            const currentTimeText = document.getElementById('currentTimeText');
            const durationText = document.getElementById('durationText');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeIcon = document.getElementById('volumeIcon');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const chapterContainer = document.getElementById('chapterContainer');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const videoError = document.getElementById('videoError');
            const selectFolderBtn = document.getElementById('selectFolderBtn');
            const folderPath = document.getElementById('folderPath');

            // ============================================================
            //  ESTADO
            // ============================================================
            let currentChapter = 1;
            let isPlaying = false;
            let isDragging = false;
            let saveInterval = null;
            let shouldPlayOnLoad = false;
            let folderHandle = null; // Para la API File System Access
            let fileMap = new Map();  // número -> File

            // ============================================================
            //  UTILS
            // ============================================================
            function formatTime(seconds) {
                if (!seconds || isNaN(seconds) || !isFinite(seconds)) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            // ============================================================
            //  LOCALSTORAGE (memoria por capítulo)
            // ============================================================
            function getStoredTime(chap) {
                const key = `sl_t4_cap${chap}_time`;
                const val = localStorage.getItem(key);
                return val ? parseFloat(val) : 0;
            }
            function setStoredTime(chap, time) {
                const key = `sl_t4_cap${chap}_time`;
                localStorage.setItem(key, String(time));
            }
            function getStoredWatched(chap) {
                const key = `sl_t4_cap${chap}_watched`;
                return localStorage.getItem(key) === 'true';
            }
            function setStoredWatched(chap, watched) {
                const key = `sl_t4_cap${chap}_watched`;
                localStorage.setItem(key, String(watched));
            }
            function getChapterDuration(chap) {
                const key = `sl_t4_cap${chap}_duration`;
                const val = localStorage.getItem(key);
                return val ? parseFloat(val) : 0;
            }
            function setChapterDuration(chap, dur) {
                const key = `sl_t4_cap${chap}_duration`;
                localStorage.setItem(key, String(dur));
            }
            function saveFolderName(name) {
                localStorage.setItem('selectedFolderName', name);
            }
            function getStoredFolderName() {
                return localStorage.getItem('selectedFolderName') || null;
            }

            // ============================================================
            //  LÓGICA "VISTO" (faltando 2 minutos)
            // ============================================================
            function checkAndUpdateWatched(chap, currentTime, duration) {
                if (!duration || duration <= 0) return;
                const remaining = duration - currentTime;
                if (remaining <= 120 && currentTime > 10) {
                    if (!getStoredWatched(chap)) {
                        setStoredWatched(chap, true);
                        updateChapterListProgress();
                    }
                }
            }

            // ============================================================
            //  VOLUMEN MÁXIMO FIJO
            // ============================================================
            function setVolumeMax() {
                video.volume = 1;
                volumeSlider.value = 1;
                volumeIcon.textContent = '🔊';
            }

            // ============================================================
            //  CARGAR VIDEO (prioriza carpeta seleccionada, luego GitHub Releases)
            // ============================================================
            function loadChapter(chap, autoPlay = false) {
                if (chap < 1 || chap > TOTAL_CHAPTERS) return;

                // Guardar estado del capítulo actual
                if (currentChapter && video.currentTime > 0) {
                    setStoredTime(currentChapter, video.currentTime);
                    if (video.duration) {
                        checkAndUpdateWatched(currentChapter, video.currentTime, video.duration);
                    }
                }

                // Limpiar eventos e intervalos
                if (saveInterval) {
                    clearInterval(saveInterval);
                    saveInterval = null;
                }
                video.onloadedmetadata = null;
                video.onerror = null;
                video.ontimeupdate = null;
                video.onended = null;

                videoError.classList.remove('visible');
                loadingOverlay.classList.add('visible');

                currentChapter = chap;
                shouldPlayOnLoad = autoPlay;

                // 1. Intentar usar archivo de la carpeta seleccionada (si existe)
                let fileToLoad = null;
                if (folderHandle && fileMap.has(chap)) {
                    fileToLoad = fileMap.get(chap);
                }

                if (fileToLoad) {
                    // Crear URL del objeto File
                    const objectURL = URL.createObjectURL(fileToLoad);
                    console.log('Cargando desde carpeta:', fileToLoad.name);
                    video.src = objectURL;
                    // La URL se revocará cuando cambiemos de capítulo o al recargar
                    // Guardamos la URL para limpiar después (opcional)
                } else {
                    // 2. Usar GitHub Releases
                    const releaseUrl = getReleaseUrl(chap);
                    console.log('Cargando desde GitHub Releases:', releaseUrl);
                    video.src = releaseUrl;
                }

                video.load();

                // Restaurar tiempo guardado
                const savedTime = getStoredTime(chap);
                video.currentTime = savedTime;

                updateChapterListActive(chap);

                if (isPlaying) {
                    video.pause();
                    isPlaying = false;
                    updatePlayButton();
                }

                updateProgressDisplay();

                // ---- EVENTOS DEL VIDEO ----
                video.onloadedmetadata = function() {
                    loadingOverlay.classList.remove('visible');
                    const dur = video.duration;
                    if (dur && isFinite(dur)) {
                        setChapterDuration(chap, dur);
                    }
                    updateDurationDisplay();
                    updateProgressDisplay();
                    updateChapterListProgress();
                    checkAndUpdateWatched(chap, video.currentTime, video.duration);

                    if (shouldPlayOnLoad) {
                        video.play().catch(() => {});
                        isPlaying = true;
                        updatePlayButton();
                        shouldPlayOnLoad = false;
                    }
                };

                video.onerror = function(e) {
                    loadingOverlay.classList.remove('visible');
                    videoError.classList.add('visible');
                    const fileName = video.src ? video.src.split('/').pop() : 'desconocido';
                    let extraMsg = '';
                    if (fileToLoad) {
                        extraMsg = 'Verifica que el archivo no esté dañado o que tengas permisos.';
                    } else {
                        extraMsg = 'Asegúrate de que el enlace de GitHub Releases sea correcto o selecciona una carpeta local.';
                    }
                    videoError.innerHTML = `
                        ⚠️ No se pudo cargar el video
                        <span>Archivo: "${fileName}"</span>
                        <span style="font-size:0.7rem;color:#ff6b6b;margin-top:4px;">${extraMsg}</span>
                    `;
                    console.error('Error cargando video:', video.src, e);
                };

                video.ontimeupdate = function() {
                    if (!isDragging) {
                        updateProgressDisplay();
                        if (video.duration) {
                            checkAndUpdateWatched(currentChapter, video.currentTime, video.duration);
                        }
                    }
                };

                video.onended = function() {
                    if (!getStoredWatched(currentChapter)) {
                        setStoredWatched(currentChapter, true);
                        updateChapterListProgress();
                    }
                    setStoredTime(currentChapter, video.duration || 0);
                    updateChapterListProgress();
                    isPlaying = false;
                    updatePlayButton();
                    updateProgressDisplay();
                };

                startAutoSave();
                setVolumeMax();
                updateChapterListProgress();
            }

            // ============================================================
            //  AUTOGUARDADO (cada 3 segundos)
            // ============================================================
            function startAutoSave() {
                if (saveInterval) clearInterval(saveInterval);
                saveInterval = setInterval(() => {
                    if (video && video.currentTime > 0 && video.duration && isFinite(video.duration)) {
                        setStoredTime(currentChapter, video.currentTime);
                        checkAndUpdateWatched(currentChapter, video.currentTime, video.duration);
                        updateChapterListProgress();
                    }
                }, 3000);
            }

            // ============================================================
            //  UI
            // ============================================================
            function updatePlayButton() {
                playIcon.textContent = isPlaying ? '⏸' : '▶';
                playPauseBtn.setAttribute('aria-label', isPlaying ? 'Pausar' : 'Reproducir');
            }

            function updateProgressDisplay() {
                if (!video.duration || !isFinite(video.duration) || video.duration === 0) {
                    progressBar.value = 0;
                    currentTimeDisplay.textContent = '0:00';
                    currentTimeText.textContent = '0:00';
                    progressBar.style.background = `linear-gradient(to right, #b47ae0 0%, #b47ae0 0%, #2d1b3d 0%)`;
                    return;
                }
                const percent = (video.currentTime / video.duration) * 100;
                progressBar.value = percent;
                progressBar.style.background = `linear-gradient(to right, #b47ae0 0%, #b47ae0 ${percent}%, #2d1b3d ${percent}%, #2d1b3d 100%)`;
                currentTimeDisplay.textContent = formatTime(video.currentTime);
                currentTimeText.textContent = formatTime(video.currentTime);
            }

            function updateDurationDisplay() {
                if (video.duration && isFinite(video.duration) && video.duration > 0) {
                    durationText.textContent = formatTime(video.duration);
                } else {
                    durationText.textContent = '0:00';
                }
            }

            // ============================================================
            //  LISTA DE CAPÍTULOS
            // ============================================================
            function buildChapterList() {
                chapterContainer.innerHTML = '';
                for (let i = 1; i <= TOTAL_CHAPTERS; i++) {
                    const div = document.createElement('div');
                    div.className = 'chapter-item';
                    div.dataset.chapter = i;

                    const numSpan = document.createElement('span');
                    numSpan.className = 'num';
                    numSpan.textContent = i;

                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'title';
                    titleSpan.textContent = `Capítulo ${i}`;

                    const statusIcon = document.createElement('span');
                    statusIcon.className = 'status-icon';
                    statusIcon.id = `status-icon-${i}`;
                    statusIcon.textContent = '⏳';

                    div.appendChild(numSpan);
                    div.appendChild(titleSpan);
                    div.appendChild(statusIcon);

                    div.addEventListener('click', function(e) {
                        const chap = parseInt(this.dataset.chapter);
                        if (chap === currentChapter) {
                            if (video.paused) {
                                video.play().catch(() => {});
                                isPlaying = true;
                                updatePlayButton();
                            } else {
                                video.pause();
                                isPlaying = false;
                                updatePlayButton();
                            }
                            return;
                        }
                        loadChapter(chap, true);
                    });

                    chapterContainer.appendChild(div);
                }
                updateChapterListProgress();
                updateChapterListActive(1);
            }

            function updateChapterListProgress() {
                for (let i = 1; i <= TOTAL_CHAPTERS; i++) {
                    const icon = document.getElementById(`status-icon-${i}`);
                    if (!icon) continue;
                    const watched = getStoredWatched(i);
                    const progress = getStoredTime(i) / (getChapterDuration(i) || 1);
                    if (watched) {
                        icon.textContent = '✅';
                        icon.className = 'status-icon checked';
                    } else if (progress > 0.05) {
                        icon.textContent = '⏳';
                        icon.className = 'status-icon pending';
                        icon.title = `${Math.round(progress * 100)}% visto`;
                    } else {
                        icon.textContent = '⏳';
                        icon.className = 'status-icon pending';
                        icon.title = 'No iniciado';
                    }
                }
            }

            function updateChapterListActive(chap) {
                const items = document.querySelectorAll('.chapter-item');
                items.forEach(el => {
                    el.classList.remove('active');
                    const c = parseInt(el.dataset.chapter);
                    if (c === chap) {
                        el.classList.add('active');
                        el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                    }
                });
            }

            // ============================================================
            //  SELECCIÓN DE CARPETA (File System Access API)
            // ============================================================
            async function selectFolder() {
                try {
                    if (!window.showDirectoryPicker) {
                        alert('Tu navegador no soporta la selección de carpetas. Usa Chrome/Edge/Opera con HTTPS o localhost.');
                        return;
                    }
                    const handle = await window.showDirectoryPicker();
                    folderHandle = handle;
                    fileMap.clear();
                    let foundAny = false;
                    for await (const entry of handle.values()) {
                        if (entry.kind === 'file' && entry.name.endsWith('.mp4')) {
                            const name = entry.name;
                            // Extraer número del nombre (busca el primer número)
                            const match = name.match(/\d+/);
                            if (match) {
                                const num = parseInt(match[0]);
                                if (num >= 1 && num <= TOTAL_CHAPTERS) {
                                    const file = await entry.getFile();
                                    fileMap.set(num, file);
                                    foundAny = true;
                                }
                            }
                        }
                    }
                    if (!foundAny) {
                        alert('No se encontraron archivos .mp4 con números del 1 al 12 en la carpeta.');
                        folderHandle = null;
                        fileMap.clear();
                        folderPath.textContent = 'Usando GitHub Releases (CP1.mp4 - CP12.mp4)';
                        localStorage.removeItem('selectedFolderName');
                        return;
                    }
                    // Mostrar nombre de carpeta
                    folderPath.textContent = `📂 ${handle.name} (${fileMap.size} videos encontrados)`;
                    localStorage.setItem('selectedFolderName', handle.name);
                    // Recargar el capítulo actual con la nueva carpeta
                    loadChapter(currentChapter, false);
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error('Error seleccionando carpeta:', err);
                        alert('Error al seleccionar la carpeta: ' + err.message);
                    }
                }
            }

            // ============================================================
            //  EVENTOS DE CONTROLES
            // ============================================================
            playPauseBtn.addEventListener('click', function() {
                if (video.paused) {
                    video.play().catch(() => {});
                    isPlaying = true;
                } else {
                    video.pause();
                    isPlaying = false;
                    if (video.currentTime > 0) {
                        setStoredTime(currentChapter, video.currentTime);
                        checkAndUpdateWatched(currentChapter, video.currentTime, video.duration);
                        updateChapterListProgress();
                    }
                }
                updatePlayButton();
            });

            video.addEventListener('click', function() {
                playPauseBtn.click();
            });

            progressBar.addEventListener('input', function() {
                isDragging = true;
                if (video.duration && isFinite(video.duration) && video.duration > 0) {
                    const time = (parseFloat(this.value) / 100) * video.duration;
                    video.currentTime = time;
                    currentTimeDisplay.textContent = formatTime(time);
                    currentTimeText.textContent = formatTime(time);
                    this.style.background = `linear-gradient(to right, #b47ae0 0%, #b47ae0 ${this.value}%, #2d1b3d ${this.value}%, #2d1b3d 100%)`;
                }
            });

            progressBar.addEventListener('change', function() {
                isDragging = false;
                if (video.duration && isFinite(video.duration) && video.duration > 0) {
                    const time = (parseFloat(this.value) / 100) * video.duration;
                    video.currentTime = time;
                    setStoredTime(currentChapter, time);
                    checkAndUpdateWatched(currentChapter, time, video.duration);
                    updateChapterListProgress();
                }
                updateProgressDisplay();
            });

            volumeSlider.addEventListener('input', function() {
                setVolumeMax();
            });

            fullscreenBtn.addEventListener('click', function() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen?.() || document.documentElement.webkitRequestFullscreen?.();
                } else {
                    document.exitFullscreen?.() || document.webkitExitFullscreen?.();
                }
            });

            selectFolderBtn.addEventListener('click', selectFolder);

            // ============================================================
            //  INICIALIZACIÓN
            // ============================================================
            function init() {
                buildChapterList();
                // Verificar si hay un nombre de carpeta guardado (solo para mostrar)
                const storedName = getStoredFolderName();
                if (storedName) {
                    folderPath.textContent = `📂 ${storedName} (selecciona de nuevo para usar)`;
                }
                // Cargar el primer capítulo desde GitHub Releases (por defecto)
                loadChapter(1, false);
                setVolumeMax();
                updateDurationDisplay();
                startAutoSave();

                // Reforzar volumen máximo cada 5 segundos
                setInterval(setVolumeMax, 5000);

                // Guardar antes de cerrar
                window.addEventListener('beforeunload', function() {
                    if (video.currentTime > 0) {
                        setStoredTime(currentChapter, video.currentTime);
                        checkAndUpdateWatched(currentChapter, video.currentTime, video.duration);
                    }
                });
            }

            init();
        })();
    </script>
</body>
</html>
