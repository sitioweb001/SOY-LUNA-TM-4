<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Soy Luna · Volver a Rodar (T4)</title>
    <style>
        /* ===== RESET Y DECORACIÓN ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 10% 20%, #2d1b3d 0%, #0f0718 100%);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #f0e6f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(180,70,255,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255,100,200,0.10) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .app {
            max-width: 1200px;
            width: 100%;
            background: rgba(30, 15, 45, 0.82);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 30px 60px -10px rgba(0,0,0,0.9), 0 0 0 1px rgba(180,70,255,0.2);
            border: 1px solid rgba(200,130,255,0.15);
            position: relative;
            z-index: 1;
            transition: box-shadow 0.3s;
        }
        .app:hover { box-shadow: 0 30px 60px -10px rgba(0,0,0,0.9), 0 0 0 1px rgba(180,70,255,0.3), 0 0 40px rgba(180,70,255,0.1); }

        /* ===== MODO MAXIMIZADO (pseudo-fullscreen fiable en tablet/móvil) ===== */
        /* No dependemos solo de la Fullscreen API nativa (falla o es limitada en
           muchos navegadores móviles, sobre todo iOS Safari). Este overlay fijo
           cubre toda la pantalla siempre, y además se activa junto a la API nativa
           cuando está disponible. Así el botón de minimizar funciona en todos lados. */
        .app.is-fullscreen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* alto real en móvil, evita saltos por la barra del navegador */
            max-width: 100%;
            margin: 0;
            padding: 0;
            border-radius: 0;
            background: #000;
            box-shadow: none;
            border: none;
            backdrop-filter: none;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            animation: fadeInMax 0.18s ease-out;
        }
        @keyframes fadeInMax { from { opacity: 0.4; } to { opacity: 1; } }
        .app.is-fullscreen .header,
        .app.is-fullscreen .folder-selector,
        .app.is-fullscreen .main-grid .chapter-list {
            display: none !important;
        }
        .app.is-fullscreen .main-grid {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            grid-template-columns: 1fr;
            gap: 0;
        }
        .app.is-fullscreen .player-fullscreen-container {
            border-radius: 0;
            background: #000;
            flex: 1;
            min-height: 0;
            height: auto;
        }
        .app.is-fullscreen .player-wrapper {
            border-radius: 0;
            box-shadow: none;
            flex: 1;
            min-height: 0;
        }
        /* El video ocupa todo el espacio disponible entre el borde superior y los
           controles, en vez de forzar 16:9 (así se aprovecha bien tablet/vertical) */
        .app.is-fullscreen .player-wrapper video {
            flex: 1;
            width: 100%;
            height: 100%;
            min-height: 0;
            aspect-ratio: unset;
            object-fit: contain;
            background: #000;
        }
        .app.is-fullscreen .controls {
            background: rgba(0,0,0,0.85);
            padding-bottom: max(14px, env(safe-area-inset-bottom));
            padding-left: max(14px, env(safe-area-inset-left));
            padding-right: max(14px, env(safe-area-inset-right));
            flex-shrink: 0;
        }

        /* ===== BOTÓN FLOTANTE DE MINIMIZAR ===== */
        /* Botón extra, muy visible, fijo en la esquina superior derecha.
           Solo aparece cuando el reproductor está maximizado: es el control
           claro y directo para "salir" que antes faltaba. */
        .btn-minimize-float {
            display: none;
            position: fixed;
            top: max(14px, env(safe-area-inset-top));
            right: max(14px, env(safe-area-inset-right));
            z-index: 10000;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            background: rgba(15, 7, 24, 0.65);
            border: 1px solid rgba(200,130,255,0.35);
            color: #f0e6f6;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: background 0.2s, transform 0.15s;
        }
        .btn-minimize-float:hover {
            background: rgba(180,70,255,0.35);
            transform: scale(1.06);
        }
        .btn-minimize-float:active { transform: scale(0.92); }
        .btn-minimize-float svg { width: 20px; height: 20px; }
        .app.is-fullscreen .btn-minimize-float {
            display: flex;
        }

        /* ===== CONTENEDOR PARA PANTALLA COMPLETA ===== */
        .player-fullscreen-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #0d0814;
            border-radius: 24px;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(200,130,255,0.15);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #b47ae0, #d47bff, #b47ae0, transparent);
            filter: blur(2px);
            opacity: 0.6;
        }
        .header h1 {
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f9b5d0, #d47bff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(180,70,255,0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header h1::before {
            content: '✨';
            font-size: 1.2rem;
            -webkit-text-fill-color: initial;
            filter: drop-shadow(0 0 10px rgba(180,70,255,0.5));
        }
        .header .badge {
            background: linear-gradient(135deg, rgba(180,70,255,0.25), rgba(130,50,200,0.15));
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(180,70,255,0.3);
            backdrop-filter: blur(4px);
            color: #d4b0ff;
            box-shadow: 0 0 20px rgba(180,70,255,0.1);
            letter-spacing: 0.3px;
        }

        /* ===== GRID PRINCIPAL ===== */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
        }

        /* ===== PLAYER WRAPPER ===== */
        .player-wrapper {
            background: #0d0814;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(180,70,255,0.15);
            position: relative;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .player-wrapper video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #09050e;
            cursor: pointer;
            touch-action: none;
        }

        /* ===== ERROR Y LOADING ===== */
        .video-error, .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(8px);
            border-radius: 24px 24px 0 0;
        }
        .video-error {
            background: rgba(20,5,30,0.92);
            color: #ff6b6b;
            padding: 20px;
            text-align: center;
            font-size: 1rem;
            border: 1px solid rgba(255,107,107,0.2);
            flex-direction: column;
            gap: 8px;
        }
        .video-error.visible { display: flex; }
        .video-error span { color: #b8a5cf; font-size: 0.8rem; }
        .loading-overlay { background: rgba(0,0,0,0.6); }
        .loading-overlay.visible { display: flex; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(180,70,255,0.15);
            border-top: 3px solid #d47bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 30px rgba(180,70,255,0.2);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ===== CONTROLES ===== */
        .controls {
            padding: 10px 14px 14px;
            background: rgba(18,8,28,0.95);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(180,70,255,0.15);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .controls-top {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .controls-top .time {
            font-size: 0.8rem;
            font-variant-numeric: tabular-nums;
            color: #c4b0db;
            min-width: 90px;
            font-weight: 500;
        }
        .controls-top .time span { color: #f0e6f6; }
        .controls-top .volume-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
            opacity: 0.6;
            cursor: not-allowed;
        }
        .controls-top .volume-wrap .icon-emoji {
            font-size: 1.1rem;
            color: #d4b0ff;
            width: 24px;
            text-align: center;
        }

        .btn-icon {
            background: rgba(255,255,255,0.06);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f0e6f6;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.25s;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(180,70,255,0.15);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-icon:hover {
            background: rgba(180,70,255,0.25);
            transform: scale(1.05);
            border-color: rgba(180,70,255,0.4);
            box-shadow: 0 0 25px rgba(180,70,255,0.15);
        }
        .btn-icon:active { transform: scale(0.92); }
        .btn-icon.play-btn {
            width: 44px;
            height: 44px;
            font-size: 1.5rem;
            background: rgba(180,70,255,0.2);
            border-color: rgba(180,70,255,0.3);
            flex-shrink: 0;
        }
        .btn-icon.play-btn:hover {
            background: rgba(180,70,255,0.35);
            box-shadow: 0 0 30px rgba(180,70,255,0.2);
        }

        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .progress-wrap input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 10px;
            background: linear-gradient(to right, #b47ae0 0%, #b47ae0 0%, #2d1b3d 0%);
            outline: none;
            transition: background 0.1s;
            cursor: pointer;
            touch-action: none;
        }
        .progress-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle, #d47bff, #a855f7);
            box-shadow: 0 0 20px rgba(180,70,255,0.5);
            border: 2px solid #1c0f2b;
            transition: 0.15s;
            cursor: pointer;
        }
        .progress-wrap input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 0 30px rgba(180,70,255,0.7);
        }
        .progress-wrap input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle, #d47bff, #a855f7);
            border: 2px solid #1c0f2b;
            cursor: pointer;
        }
        .progress-wrap .time-label {
            font-size: 0.75rem;
            color: #c4b0db;
            min-width: 45px;
            text-align: right;
            font-weight: 500;
        }
        .controls-top .volume-wrap input[type="range"] {
            width: 60px;
            height: 4px;
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== LISTA DE CAPÍTULOS ===== */
        .chapter-list {
            background: rgba(18,8,28,0.6);
            border-radius: 24px;
            padding: 14px 12px 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(180,70,255,0.1);
            max-height: 480px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #8b5cf6 transparent;
            box-shadow: inset 0 0 30px rgba(180,70,255,0.03);
        }
        .chapter-list::-webkit-scrollbar { width: 4px; }
        .chapter-list::-webkit-scrollbar-track { background: transparent; }
        .chapter-list::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 20px; box-shadow: 0 0 15px rgba(180,70,255,0.2); }
        .chapter-list h2 {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: #b8a5cf;
            margin-bottom: 10px;
            padding-left: 4px;
            text-transform: uppercase;
            opacity: 0.7;
        }
        .chapter-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            margin-bottom: 3px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .chapter-item:hover {
            background: rgba(180,70,255,0.10);
            border-color: rgba(180,70,255,0.15);
            transform: translateX(3px);
        }
        .chapter-item.active {
            background: rgba(180,70,255,0.18);
            border-color: rgba(180,70,255,0.3);
            box-shadow: 0 0 25px rgba(180,70,255,0.08);
        }
        .chapter-item .num {
            font-weight: 700;
            font-size: 0.8rem;
            color: #d4b0ff;
            min-width: 24px;
            text-align: center;
        }
        .chapter-item .title {
            flex: 1;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: -0.2px;
            color: #e8daf5;
        }
        .chapter-item .status-icon {
            font-size: 1rem;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .chapter-item .status-icon.checked {
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74,222,128,0.3);
        }
        .chapter-item .status-icon.pending {
            color: #8b7aa3;
            font-size: 0.8rem;
        }

        /* ===== SELECTOR DE CARPETA ===== */
        .folder-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            background: rgba(255,255,255,0.03);
            padding: 8px 12px;
            border-radius: 16px;
            border: 1px solid rgba(180,70,255,0.1);
        }
        .folder-selector button {
            background: rgba(180,70,255,0.2);
            border: 1px solid rgba(180,70,255,0.3);
            color: #d4b0ff;
            padding: 5px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: 0.2s;
            backdrop-filter: blur(4px);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .folder-selector button:hover {
            background: rgba(180,70,255,0.35);
            box-shadow: 0 0 20px rgba(180,70,255,0.15);
        }
        .folder-selector .folder-path {
            font-size: 0.7rem;
            color: #b8a5cf;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        .release-notice {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(74,222,128,0.1);
            border: 1px solid rgba(74,222,128,0.2);
            color: #4ade80;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 500;
            white-space: nowrap;
        }

        /* ========================================================== */
        /* ===== RESPONSIVE: TABLET Y MÓVIL ===== */
        /* ========================================================== */

        /* --- TABLET (768px - 1024px) --- */
        @media (max-width: 1024px) {
            .app { padding: 16px; border-radius: 24px; }
            .main-grid { grid-template-columns: 1fr 240px; gap: 16px; }
            .header h1 { font-size: 1.2rem; }
            .chapter-list { max-height: 400px; }
            .chapter-item { padding: 6px 8px; }
            .chapter-item .title { font-size: 0.8rem; }
            .controls { padding: 8px 12px 12px; }
            .btn-icon { width: 34px; height: 34px; font-size: 1rem; }
            .btn-icon.play-btn { width: 40px; height: 40px; font-size: 1.3rem; }
            .controls-top .time { font-size: 0.75rem; min-width: 80px; }
        }

        /* --- MÓVIL (menos de 768px) --- */
        @media (max-width: 768px) {
            body { padding: 6px; }
            .app { padding: 12px; border-radius: 20px; }
            
            .main-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            
            .header { margin-bottom: 10px; padding-bottom: 10px; }
            .header h1 { font-size: 1.1rem; }
            .header h1::before { font-size: 1rem; }
            .header .badge { font-size: 0.65rem; padding: 3px 10px; }
            
            .player-wrapper { border-radius: 16px; }
            .player-wrapper video { aspect-ratio: 16/9; }
            
            .controls { padding: 8px 10px 10px; gap: 8px; }
            .controls-top { gap: 8px; }
            .controls-top .time { font-size: 0.7rem; min-width: 70px; }
            
            .btn-icon { width: 32px; height: 32px; font-size: 0.9rem; }
            .btn-icon.play-btn { width: 38px; height: 38px; font-size: 1.2rem; }
            
            .progress-wrap input[type="range"] { height: 5px; }
            .progress-wrap input[type="range"]::-webkit-slider-thumb { width: 16px; height: 16px; }
            .progress-wrap .time-label { font-size: 0.65rem; min-width: 38px; }
            
            .controls-top .volume-wrap input[type="range"] { width: 40px; }
            .controls-top .volume-wrap .icon-emoji { font-size: 0.9rem; width: 20px; }
            
            .folder-selector {
                padding: 6px 10px;
                gap: 6px;
                border-radius: 12px;
                margin-bottom: 10px;
            }
            .folder-selector button { font-size: 0.7rem; padding: 4px 10px; }
            .folder-selector .folder-path { font-size: 0.6rem; }
            .release-notice { font-size: 0.5rem; padding: 2px 8px; }
            
            .chapter-list {
                border-radius: 16px;
                padding: 10px 8px 8px;
                max-height: 220px;
            }
            .chapter-list h2 { font-size: 0.6rem; margin-bottom: 6px; }
            .chapter-item { padding: 5px 8px; gap: 8px; border-radius: 10px; }
            .chapter-item .num { font-size: 0.7rem; min-width: 20px; }
            .chapter-item .title { font-size: 0.75rem; }
            .chapter-item .status-icon { font-size: 0.85rem; width: 20px; }
            
            .video-error { font-size: 0.85rem; padding: 16px; }
            .video-error span { font-size: 0.7rem; }
            .spinner { width: 32px; height: 32px; border-width: 3px; }
        }

        /* --- MÓVIL PEQUEÑO (menos de 400px) --- */
        @media (max-width: 400px) {
            .app { padding: 8px; border-radius: 16px; }
            .header h1 { font-size: 0.95rem; }
            .header .badge { font-size: 0.55rem; padding: 2px 8px; }
            .controls-top .time { font-size: 0.6rem; min-width: 60px; }
            .btn-icon { width: 34px; height: 34px; font-size: 0.9rem; }
            .btn-icon.play-btn { width: 40px; height: 40px; font-size: 1.15rem; }
            .controls { padding: 6px 8px 8px; gap: 6px; }
            .progress-wrap input[type="range"] { height: 4px; }
            .progress-wrap input[type="range"]::-webkit-slider-thumb { width: 14px; height: 14px; }
            .progress-wrap .time-label { font-size: 0.55rem; min-width: 32px; }
            .chapter-list { max-height: 160px; padding: 6px 4px 4px; }
            .chapter-item .title { font-size: 0.65rem; }
            .chapter-item .num { font-size: 0.6rem; min-width: 16px; }
            .chapter-item .status-icon { font-size: 0.7rem; width: 16px; }
            .folder-selector button { font-size: 0.6rem; padding: 3px 8px; }
            .folder-selector .folder-path { font-size: 0.55rem; }
        }

        /* --- MODO HORIZONTAL EN MÓVIL --- */
        @media (max-width: 768px) and (orientation: landscape) {
            .app { padding: 8px 12px; }
            .main-grid { gap: 10px; }
            .header { margin-bottom: 6px; padding-bottom: 6px; }
            .header h1 { font-size: 0.9rem; }
            .chapter-list { max-height: 120px; }
            .controls { padding: 6px 10px 8px; }
            .player-wrapper video { aspect-ratio: 16/9; max-height: 50vh; }
            .folder-selector { margin-bottom: 6px; padding: 4px 8px; }
        }

        /* ===== MAXIMIZADO EN MÓVIL/TABLET: controles más grandes y fáciles de tocar ===== */
        .app.is-fullscreen .controls-top .time { font-size: 0.8rem; }
        .app.is-fullscreen .btn-icon { width: 40px; height: 40px; font-size: 1.2rem; }
        .app.is-fullscreen .btn-icon.play-btn { width: 48px; height: 48px; font-size: 1.6rem; }
        .app.is-fullscreen .progress-wrap input[type="range"] { height: 6px; }
        .app.is-fullscreen .progress-wrap input[type="range"]::-webkit-slider-thumb { width: 20px; height: 20px; }
        @media (max-width: 768px) and (orientation: landscape) {
            .btn-minimize-float { top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); width: 38px; height: 38px; }
            .btn-minimize-float svg { width: 17px; height: 17px; }
        }

        .icon-emoji { font-size: 1rem; line-height: 1; }
    </style>
</head>
<body>
    <div class="app" id="app" role="main">
        <header class="header">
            <h1>Soy Luna · Volver a Rodar</h1>
            <span class="badge">✦ Temporada 4 · 12 capítulos</span>
        </header>

        <div class="folder-selector">
            <button id="selectFolderBtn">📁 Seleccionar carpeta de videos</button>
            <span class="folder-path" id="folderPath"></span>
            <span class="release-notice">☁️ v1.0.0 © EMERSON CASTRO</span>
        </div>

        <div class="main-grid">
            <!-- CONTENEDOR PARA PANTALLA COMPLETA -->
            <div class="player-fullscreen-container" id="playerFullscreenContainer">
                <section class="player-wrapper">
                    <div class="loading-overlay" id="loadingOverlay">
                        <div class="spinner"></div>
                    </div>
                    <video id="videoPlayer" preload="metadata" playsinline webkit-playsinline></video>
                    <div class="video-error" id="videoError">
                        ⚠️ No se pudo cargar el video
                        <span>Verifica el enlace de GitHub Releases o selecciona una carpeta local.</span>
                    </div>

                    <div class="controls">
                        <div class="progress-wrap">
                            <input type="range" id="progressBar" value="0" step="0.001" aria-label="Barra de progreso">
                            <span class="time-label" id="currentTimeDisplay">0:00</span>
                        </div>
                        <div class="controls-top">
                            <button class="btn-icon play-btn" id="playPauseBtn" aria-label="Reproducir / Pausar">
                                <span id="playIcon">▶</span>
                            </button>
                            <span class="time" id="timeDisplay">
                                <span id="currentTimeText">0:00</span> / <span id="durationText">0:00</span>
                            </span>

                            <div class="volume-wrap" title="Volumen fijado al 100%">
                                <span class="icon-emoji" id="volumeIcon">🔊</span>
                                <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" disabled>
                            </div>

                            <button class="btn-icon" id="fullscreenBtn" aria-label="Maximizar reproductor">
                                <span class="icon-emoji" id="iconExpand">
                                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H4v4M16 3h4v4M8 21H4v-4M16 21h4v-4"/></svg>
                                </span>
                                <span class="icon-emoji" id="iconCompress" style="display:none;">
                                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4V5M20 9h-4V5M4 15h4v4M20 15h-4v4"/></svg>
                                </span>
                            </button>
                        </div>
                    </div>

                    <!-- Botón flotante, siempre visible arriba a la derecha SOLO al maximizar.
                         Es el control claro de "minimizar" que antes faltaba. -->
                    <button class="btn-minimize-float" id="minimizeFloatBtn" aria-label="Minimizar reproductor">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4V5M20 9h-4V5M4 15h4v4M20 15h-4v4"/></svg>
                    </button>
                </section>
            </div>

            <aside class="chapter-list" id="chapterList">
                <h2>📖 Capítulos</h2>
                <div id="chapterContainer"></div>
            </aside>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const TOTAL_CHAPTERS = 12;

            // ============================================================
            //  CONFIGURACIÓN: URLs de GitHub Releases
            // ============================================================
            const RELEASE_BASE_URL =
                'https://github.com/sitioweb001/SOY-LUNA-TM-4/releases/download/v1.0.0/';
            const getReleaseUrl = (num) => `${RELEASE_BASE_URL}CP${num}.mp4`;

            // ============================================================
            //  DOM
            // ============================================================
            const app = document.getElementById('app');
            const container = document.getElementById('playerFullscreenContainer');
            const video = document.getElementById('videoPlayer');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const playIcon = document.getElementById('playIcon');
            const progressBar = document.getElementById('progressBar');
            const currentTimeDisplay = document.getElementById('currentTimeDisplay');
            const currentTimeText = document.getElementById('currentTimeText');
            const durationText = document.getElementById('durationText');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeIcon = document.getElementById('volumeIcon');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const iconExpand = document.getElementById('iconExpand');
            const iconCompress = document.getElementById('iconCompress');
            const minimizeFloatBtn = document.getElementById('minimizeFloatBtn');
            const chapterContainer = document.getElementById('chapterContainer');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const videoError = document.getElementById('videoError');
            const selectFolderBtn = document.getElementById('selectFolderBtn');
            const folderPath = document.getElementById('folderPath');

            // ============================================================
            //  ESTADO
            // ============================================================
            let currentChapter = 1;
            let isPlaying = false;
            let isDragging = false;
            let saveInterval = null;
            let shouldPlayOnLoad = false;
            let folderHandle = null;
            let fileMap = new Map();
            let manualMaximize = false; // fallback cuando la Fullscreen API nativa no funciona (p.ej. iOS Safari)

            // ============================================================
            //  UTILS
            // ============================================================
            function formatTime(seconds) {
                if (!seconds || isNaN(seconds) || !isFinite(seconds)) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            // ============================================================
            //  LOCALSTORAGE
            // ============================================================
            function getStoredTime(chap) {
                const key = `sl_t4_cap${chap}_time`;
                const val = localStorage.getItem(key);
                return val ? parseFloat(val) : 0;
            }
            function setStoredTime(chap, time) {
                const key = `sl_t4_cap${chap}_time`;
                localStorage.setItem(key, String(time));
            }
            function getStoredWatched(chap) {
                const key = `sl_t4_cap${chap}_watched`;
                return localStorage.getItem(key) === 'true';
            }
            function setStoredWatched(chap, watched) {
                const key = `sl_t4_cap${chap}_watched`;
                localStorage.setItem(key, String(watched));
            }
            function getChapterDuration(chap) {
                const key = `sl_t4_cap${chap}_duration`;
                const val = localStorage.getItem(key);
                return val ? parseFloat(val) : 0;
            }
            function setChapterDuration(chap, dur) {
                const key = `sl_t4_cap${chap}_duration`;
                localStorage.setItem(key, String(dur));
            }
            function saveFolderName(name) {
                localStorage.setItem('selectedFolderName', name);
            }
            function getStoredFolderName() {
                return localStorage.getItem('selectedFolderName') || null;
            }

            // ============================================================
            //  LÓGICA "VISTO" (faltando 2 min)
            // ============================================================
            function checkAndUpdateWatched(chap, currentTime, duration) {
                if (!duration || duration <= 0) return;
                const remaining = duration - currentTime;
                if (remaining <= 120 && currentTime > 10) {
                    if (!getStoredWatched(chap)) {
                        setStoredWatched(chap, true);
                        updateChapterListProgress();
                    }
                }
            }

            // ============================================================
            //  VOLUMEN MÁXIMO
            // ============================================================
            function setVolumeMax() {
                video.volume = 1;
                volumeSlider.value = 1;
                volumeIcon.textContent = '🔊';
            }

            // ============================================================
            //  CARGAR VIDEO
            // ============================================================
            function loadChapter(chap, autoPlay = false) {
                if (chap < 1 || chap > TOTAL_CHAPTERS) return;

                if (currentChapter && video.currentTime > 0) {
                    setStoredTime(currentChapter, video.currentTime);
                    if (video.duration) {
                        checkAndUpdateWatched(currentChapter, video.currentTime, video.duration);
                    }
                }

                if (saveInterval) {
                    clearInterval(saveInterval);
                    saveInterval = null;
                }
                video.onloadedmetadata = null;
                video.onerror = null;
                video.ontimeupdate = null;
                video.onended = null;

                videoError.classList.remove('visible');
                loadingOverlay.classList.add('visible');

                currentChapter = chap;
                shouldPlayOnLoad = autoPlay;

                let fileToLoad = null;
                if (folderHandle && fileMap.has(chap)) {
                    fileToLoad = fileMap.get(chap);
                }

                if (fileToLoad) {
                    const objectURL = URL.createObjectURL(fileToLoad);
                    console.log('Cargando desde carpeta:', fileToLoad.name);
                    video.src = objectURL;
                } else {
                    const releaseUrl = getReleaseUrl(chap);
                    console.log('Cargando desde GitHub Releases:', releaseUrl);
                    video.src = releaseUrl;
                }

                video.load();

                const savedTime = getStoredTime(chap);
                video.currentTime = savedTime;

                updateChapterListActive(chap);

                if (isPlaying) {
                    video.pause();
                    isPlaying = false;
                    updatePlayButton();
                }

                updateProgressDisplay();

                video.onloadedmetadata = function() {
                    loadingOverlay.classList.remove('visible');
                    const dur = video.duration;
                    if (dur && isFinite(dur)) {
                        setChapterDuration(chap, dur);
                    }
                    updateDurationDisplay();
                    updateProgressDisplay();
                    updateChapterListProgress();
                    checkAndUpdateWatched(chap, video.currentTime, video.duration);

                    if (shouldPlayOnLoad) {
                        video.play().catch(() => {});
                        isPlaying = true;
                        updatePlayButton();
                        shouldPlayOnLoad = false;
                    }
                };

                video.onerror = function(e) {
                    loadingOverlay.classList.remove('visible');
                    videoError.classList.add('visible');
                    const fileName = video.src ? video.src.split('/').pop() : 'desconocido';
                    let extraMsg = '';
                    if (fileToLoad) {
                        extraMsg = 'Verifica que el archivo no esté dañado o que tengas permisos.';
                    } else {
                        extraMsg = 'Asegúrate de que el enlace de GitHub Releases sea correcto o selecciona una carpeta local.';
                    }
                    videoError.innerHTML = `
                        ⚠️ No se pudo cargar el video
                        <span>Archivo: "${fileName}"</span>
                        <span style="font-size:0.7rem;color:#ff6b6b;margin-top:4px;">${extraMsg}</span>
                    `;
                    console.error('Error cargando video:', video.src, e);
                };

                video.ontimeupdate = function() {
                    if (!isDragging) {
                        updateProgressDisplay();
                        if (video.duration) {
                            checkAndUpdateWatched(currentChapter, video.currentTime, video.duration);
                        }
                    }
                };

                video.onended = function() {
                    if (!getStoredWatched(currentChapter)) {
                        setStoredWatched(currentChapter, true);
                        updateChapterListProgress();
                    }
                    setStoredTime(currentChapter, video.duration || 0);
                    updateChapterListProgress();
                    isPlaying = false;
                    updatePlayButton();
                    updateProgressDisplay();
                };

                startAutoSave();
                setVolumeMax();
                updateChapterListProgress();
            }

            // ============================================================
            //  AUTOGUARDADO
            // ============================================================
            function startAutoSave() {
                if (saveInterval) clearInterval(saveInterval);
                saveInterval = setInterval(() => {
                    if (video && video.currentTime > 0 && video.duration && isFinite(video.duration)) {
                        setStoredTime(currentChapter, video.currentTime);
                        checkAndUpdateWatched(currentChapter, video.currentTime, video.duration);
                        updateChapterListProgress();
                    }
                }, 3000);
            }

            // ============================================================
            //  UI
            // ============================================================
            function updatePlayButton() {
                playIcon.textContent = isPlaying ? '⏸' : '▶';
                playPauseBtn.setAttribute('aria-label', isPlaying ? 'Pausar' : 'Reproducir');
            }

            function updateProgressDisplay() {
                if (!video.duration || !isFinite(video.duration) || video.duration === 0) {
                    progressBar.value = 0;
                    currentTimeDisplay.textContent = '0:00';
                    currentTimeText.textContent = '0:00';
                    progressBar.style.background = `linear-gradient(to right, #b47ae0 0%, #b47ae0 0%, #2d1b3d 0%)`;
                    return;
                }
                const percent = (video.currentTime / video.duration) * 100;
                progressBar.value = percent;
                progressBar.style.background = `linear-gradient(to right, #b47ae0 0%, #b47ae0 ${percent}%, #2d1b3d ${percent}%, #2d1b3d 100%)`;
                currentTimeDisplay.textContent = formatTime(video.currentTime);
                currentTimeText.textContent = formatTime(video.currentTime);
            }

            function updateDurationDisplay() {
                if (video.duration && isFinite(video.duration) && video.duration > 0) {
                    durationText.textContent = formatTime(video.duration);
                } else {
                    durationText.textContent = '0:00';
                }
            }

            // ============================================================
            //  LISTA DE CAPÍTULOS
            // ============================================================
            function buildChapterList() {
                chapterContainer.innerHTML = '';
                for (let i = 1; i <= TOTAL_CHAPTERS; i++) {
                    const div = document.createElement('div');
                    div.className = 'chapter-item';
                    div.dataset.chapter = i;

                    const numSpan = document.createElement('span');
                    numSpan.className = 'num';
                    numSpan.textContent = i;

                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'title';
                    titleSpan.textContent = `Capítulo ${i}`;

                    const statusIcon = document.createElement('span');
                    statusIcon.className = 'status-icon';
                    statusIcon.id = `status-icon-${i}`;
                    statusIcon.textContent = '⏳';

                    div.appendChild(numSpan);
                    div.appendChild(titleSpan);
                    div.appendChild(statusIcon);

                    div.addEventListener('click', function(e) {
                        const chap = parseInt(this.dataset.chapter);
                        if (chap === currentChapter) {
                            if (video.paused) {
                                video.play().catch(() => {});
                                isPlaying = true;
                                updatePlayButton();
                            } else {
                                video.pause();
                                isPlaying = false;
                                updatePlayButton();
                            }
                            return;
                        }
                        loadChapter(chap, true);
                    });

                    chapterContainer.appendChild(div);
                }
                updateChapterListProgress();
                updateChapterListActive(1);
            }

            function updateChapterListProgress() {
                for (let i = 1; i <= TOTAL_CHAPTERS; i++) {
                    const icon = document.getElementById(`status-icon-${i}`);
                    if (!icon) continue;
                    const watched = getStoredWatched(i);
                    const progress = getStoredTime(i) / (getChapterDuration(i) || 1);
                    if (watched) {
                        icon.textContent = '✅';
                        icon.className = 'status-icon checked';
                    } else if (progress > 0.05) {
                        icon.textContent = '⏳';
                        icon.className = 'status-icon pending';
                        icon.title = `${Math.round(progress * 100)}% visto`;
                    } else {
                        icon.textContent = '⏳';
                        icon.className = 'status-icon pending';
                        icon.title = 'No iniciado';
                    }
                }
            }

            function updateChapterListActive(chap) {
                const items = document.querySelectorAll('.chapter-item');
                items.forEach(el => {
                    el.classList.remove('active');
                    const c = parseInt(el.dataset.chapter);
                    if (c === chap) {
                        el.classList.add('active');
                        el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                    }
                });
            }

            // ============================================================
            //  SELECCIÓN DE CARPETA
            // ============================================================
            async function selectFolder() {
                try {
                    if (!window.showDirectoryPicker) {
                        alert('Tu navegador no soporta la selección de carpetas. Usa Chrome/Edge/Opera con HTTPS o localhost.');
                        return;
                    }
                    const handle = await window.showDirectoryPicker();
                    folderHandle = handle;
                    fileMap.clear();
                    let foundAny = false;
                    for await (const entry of handle.values()) {
                        if (entry.kind === 'file' && entry.name.endsWith('.mp4')) {
                            const name = entry.name;
                            const match = name.match(/\d+/);
                            if (match) {
                                const num = parseInt(match[0]);
                                if (num >= 1 && num <= TOTAL_CHAPTERS) {
                                    const file = await entry.getFile();
                                    fileMap.set(num, file);
                                    foundAny = true;
                                }
                            }
                        }
                    }
                    if (!foundAny) {
                        alert('No se encontraron archivos .mp4 con números del 1 al 12 en la carpeta.');
                        folderHandle = null;
                        fileMap.clear();
                        folderPath.textContent = 'Usando GitHub Releases (CP1.mp4 - CP12.mp4)';
                        localStorage.removeItem('selectedFolderName');
                        return;
                    }
                    folderPath.textContent = `📂 ${handle.name} (${fileMap.size} videos encontrados)`;
                    localStorage.setItem('selectedFolderName', handle.name);
                    loadChapter(currentChapter, false);
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error('Error seleccionando carpeta:', err);
                        alert('Error al seleccionar la carpeta: ' + err.message);
                    }
                }
            }

            // ============================================================
            //  MAXIMIZAR / MINIMIZAR REPRODUCTOR
            // ============================================================
            // Estrategia doble para que funcione igual en tablet, teléfono y PC:
            // 1) Si el navegador soporta la Fullscreen API nativa, se usa (oculta
            //    la barra del navegador en Android/Chrome/Escritorio).
            // 2) Si no está disponible o la petición falla (muy común en iOS
            //    Safari para elementos que no son <video>), se activa un modo
            //    "maximizado" manual: el reproductor se expande a toda la
            //    pantalla con CSS (position: fixed), sin depender del navegador.
            // En ambos casos el botón de la barra y el botón flotante superior
            // cambian a un ícono de "comprimir" claro para minimizar.
            function isNativeFullscreenSupported() {
                return !!(container.requestFullscreen || container.webkitRequestFullscreen);
            }

            function toggleFullscreen() {
                const nativeActive = !!(document.fullscreenElement || document.webkitFullscreenElement);

                if (nativeActive) {
                    (document.exitFullscreen?.bind(document) || document.webkitExitFullscreen?.bind(document))();
                    return;
                }

                if (manualMaximize) {
                    manualMaximize = false;
                    updateFullscreenUI();
                    return;
                }

                if (isNativeFullscreenSupported()) {
                    const request = container.requestFullscreen?.bind(container) || container.webkitRequestFullscreen?.bind(container);
                    try {
                        const result = request();
                        if (result && typeof result.catch === 'function') {
                            result.catch(() => {
                                manualMaximize = true;
                                updateFullscreenUI();
                            });
                        }
                    } catch (err) {
                        manualMaximize = true;
                        updateFullscreenUI();
                    }
                } else {
                    manualMaximize = true;
                    updateFullscreenUI();
                }
            }

            document.addEventListener('fullscreenchange', updateFullscreenUI);
            document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

            // Con el modo manual, "Escape" también debe minimizar (en desktop)
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && manualMaximize) {
                    manualMaximize = false;
                    updateFullscreenUI();
                }
            });

            function updateFullscreenUI() {
                const isFS = !!document.fullscreenElement || !!document.webkitFullscreenElement || manualMaximize;
                app.classList.toggle('is-fullscreen', isFS);
                iconExpand.style.display = isFS ? 'none' : 'inline-flex';
                iconCompress.style.display = isFS ? 'inline-flex' : 'none';
                const label = isFS ? 'Minimizar reproductor' : 'Maximizar reproductor';
                fullscreenBtn.setAttribute('aria-label', label);
                if (!isFS) {
                    setVolumeMax();
                }
            }

            // ============================================================
            //  EVENTOS DE CONTROLES
            // ============================================================
            playPauseBtn.addEventListener('click', function() {
                if (video.paused) {
                    video.play().catch(() => {});
                    isPlaying = true;
                } else {
                    video.pause();
                    isPlaying = false;
                    if (video.currentTime > 0) {
                        setStoredTime(currentChapter, video.currentTime);
                        checkAndUpdateWatched(currentChapter, video.currentTime, video.duration);
                        updateChapterListProgress();
                    }
                }
                updatePlayButton();
            });

            video.addEventListener('click', function() {
                playPauseBtn.click();
            });

            progressBar.addEventListener('input', function() {
                isDragging = true;
                if (video.duration && isFinite(video.duration) && video.duration > 0) {
                    const time = (parseFloat(this.value) / 100) * video.duration;
                    video.currentTime = time;
                    currentTimeDisplay.textContent = formatTime(time);
                    currentTimeText.textContent = formatTime(time);
                    this.style.background = `linear-gradient(to right, #b47ae0 0%, #b47ae0 ${this.value}%, #2d1b3d ${this.value}%, #2d1b3d 100%)`;
                }
            });

            progressBar.addEventListener('change', function() {
                isDragging = false;
                if (video.duration && isFinite(video.duration) && video.duration > 0) {
                    const time = (parseFloat(this.value) / 100) * video.duration;
                    video.currentTime = time;
                    setStoredTime(currentChapter, time);
                    checkAndUpdateWatched(currentChapter, time, video.duration);
                    updateChapterListProgress();
                }
                updateProgressDisplay();
            });

            volumeSlider.addEventListener('input', function() {
                setVolumeMax();
            });

            fullscreenBtn.addEventListener('click', toggleFullscreen);
            minimizeFloatBtn.addEventListener('click', toggleFullscreen);

            selectFolderBtn.addEventListener('click', selectFolder);

            // ============================================================
            //  INICIALIZACIÓN
            // ============================================================
            function init() {
                buildChapterList();
                const storedName = getStoredFolderName();
                if (storedName) {
                    folderPath.textContent = `📂 ${storedName} (selecciona de nuevo para usar)`;
                } else {
                    folderPath.textContent = 'Usando GitHub Releases (CP1.mp4 - CP12.mp4)';
                }
                loadChapter(1, false);
                setVolumeMax();
                updateDurationDisplay();
                startAutoSave();

                setInterval(setVolumeMax, 5000);

                window.addEventListener('beforeunload', function() {
                    if (video.currentTime > 0) {
                        setStoredTime(currentChapter, video.currentTime);
                        checkAndUpdateWatched(currentChapter, video.currentTime, video.duration);
                    }
                });
            }

            init();
        })();
    </script>
</body>
</html>
